  ['ഫീസ് എത്ര?','ഓരോ മത്സരാർത്ഥിക്കും AED 20.'],
  ['ഭക്ഷണ കൂപ്പൺ എങ്ങനെ കിട്ടും?','ടീം വഴി ഭക്ഷണത്തിന് പേര് നൽകിയവർക്ക് "ഭക്ഷണം" പേജിൽ പേര് തിരഞ്ഞ് കൂപ്പൺ കാണാം. കൗണ്ടറിൽ അത് കാണിക്കുക.']
 ],
 en:[
  ['When and where is the meet?','Wednesday 2 December 2026, 8:30 AM – 5:00 PM, at Shining Star International School, Musaffah – Shabiya.'],
  ['How do we submit entries?','Through your team secretary only. Fill the Excel entry form and send it to the UIC before 23/11/2026, 10:00 PM. The committee adds it to the app.'],
  ['Who can take part?','UIC members and their families, MGM members, madrasa students and their parents. Parents may enter group events only.'],
  ['Which category is my child in?','It depends on birth year. Enter the birth year on the Events page.'],
  ['How many per event?','At most 3 per event from one team, except Kids and Ladies.'],
  ['What if two of my events clash?','Track events take priority. About six events run at the same time.'],
  ['What is the fee?','AED 20 per participant.'],
  ['How do I get a food coupon?','If your team registered you for food, search your name on the Food page and show the coupon at the counter.']
 ]
};

    const x=shared[col].find(r=>r.id===id); if(x) Object.assign(x,patch); persist(col); refreshShared() },

async function initShared(){
  // The public link never asks the platform for live data, so signed-out visitors are not prompted to sign in.
  // It shows the list the organiser last published from the organiser link.
  if(PUB){ render(); return }
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [USER,DB]=await Promise.all([use('user'),use('db')]);
  if(!DB){ render(); return }
  shared.entries=[]; shared.food=[]; shared.results=[]; shared.lost=[]; shared.desk=[];
  try{ canWrite=await USER?.can('data.write') ?? null }catch(e){}
  try{ uid=await USER?.id() ?? null }catch(e){}
  try{ isAdmin=!!(USER && (await USER.canEdit() || await USER.isOwner())) }catch(e){}
  const timer=setTimeout(()=>{ if(!shared.ready){ shared.err='slow'; refreshShared() } },10000);
  DB.collection('entries').onSnapshot(s=>{
    shared.entries=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.at||0)-(b.at||0));
    if(!s.metadata.fromCache){ shared.ready=true; shared.err=''; clearTimeout(timer) }
    refreshShared();
  },e=>{ shared.err=e.code; clearTimeout(timer); refreshShared() });
  DB.collection('results').onSnapshot(s=>{ shared.results=s.docs.map(d=>({id:d.id,...d.data()})); refreshShared() },()=>{});
  DB.collection('food').onSnapshot(s=>{ shared.food=s.docs.map(d=>({id:d.id,...d.data()})); refreshShared() },()=>{});
  DB.collection('desk').onSnapshot(s=>{ shared.desk=s.docs.map(d=>({id:d.id,...d.data()})); refreshShared() },()=>{});
  DB.collection('meta').onSnapshot(s=>{ s.docs.forEach(d=>{ if(d.id==='regs') shared.regs=d.data(); if(d.id==='config') shared.cfg=d.data() }); refreshShared() },()=>{});
  DB.collection('lost').onSnapshot(s=>{ shared.lost=s.docs.flatMap(d=>d.data().reports||[]).sort((a,b)=>(b.at||0)-(a.at||0)); refreshShared() },()=>{});
  render();
}

function entryWarnings(list){
  const w=[], by={};
  list.forEach(x=>{ const c=CATS.find(k=>k.id===x.c);
    if(c){ (x.e||[]).forEach(ev=>{ if(c.lim && !/relay/i.test(ev)){ const k=x.u+'|'+c.id+'|'+ev; by[k]=(by[k]||0)+1 } });
      if(x.m==='Madrasa Parent') w.push(`${x.n} (${un(x.u)}): ${T('രക്ഷിതാക്കൾക്ക് ഗ്രൂപ്പ് ഇനങ്ങളിൽ മാത്രം','parents may enter group events only')}`);
      if(x.dob){ const y=+x.dob.slice(0,4); if(y<c.a||y>c.b) w.push(`${x.n} (${un(x.u)}): ${T(`ജനന വർഷം ${y} ${c.n}-ൽ പെടില്ല`,`birth year ${y} is outside ${c.n}`)}`) } }
    if(x.c==='tw' && x.m && x.m!=='UIC Member') w.push(`${x.n} (${un(x.u)}): ${T('വടംവലി UIC മെമ്പർമാർക്ക് മാത്രം','Gents Tug of War is for UIC members only')}`);
  });
  Object.entries(by).forEach(([k,n])=>{ if(n>3){ const [u,cid,ev]=k.split('|'); w.push(`${un(u)} · ${cat(cid).n} · ${ev}: ${T(`${n} പേർ (പരമാവധി 3)`,`${n} entered (max 3)`)}`) } });
  const units=[...new Set(list.map(x=>x.u))];
  units.forEach(u=>{
    const fg=new Set(list.filter(x=>x.u===u&&x.c==='fg').map(x=>norm(x.n)));
    list.filter(x=>x.u===u&&x.c==='fb'&&fg.has(norm(x.n))).forEach(x=>w.push(`${x.n} (${un(u)}): ${T('ഫുട്ബോൾ ബോയ്സിലും ജെന്റ്സിലും പാടില്ല','cannot play in both Boys and Gents football')}`));
    TEAMS.filter(t=>t.id!=='mp').forEach(t=>{ const tm=list.filter(x=>x.u===u&&x.c===t.id); if(!tm.length) return;
      if(tm.length>t.max) w.push(`${un(u)} · ${t.n}: ${T(`${tm.length} പേർ (പരമാവധി ${t.max})`,`${tm.length} entered (max ${t.max})`)}`);
      if(t.id!=='bd'){ if(!tm.some(x=>/manager/i.test(x.role||''))) w.push(`${un(u)} · ${t.n}: ${T('Team Manager ഇല്ല','no Team Manager')}`); if(!tm.some(x=>/captain/i.test(x.role||''))) w.push(`${un(u)} · ${t.n}: ${T('Captain ഇല്ല','no Captain')}`) } });
  });
  return w;
}

function loadXLSX(){ return window.XLSX?Promise.resolve():new Promise((ok,no)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=ok; s.onerror=no; document.head.appendChild(s) }) }
const SHEETMAP=[[/FOOTBALL.*GENT/,'fg'],[/FOOTBALL.*BOY/,'fb'],[/VOLLEY/,'vb'],[/TUG.*LAD/,'twl'],[/TUG/,'tw'],[/BADMINTON/,'bd'],[/FOOD/,'food'],[/KID/,'k'],[/SUB ?JUNIOR ?BOY/,'sjb'],[/SUB ?JUNIOR ?GIRL/,'sjg'],[/SUPER ?SENIOR ?BOY/,'ssb'],[/SUPER ?SENIOR ?GIRL/,'ssg'],[/JUNIOR ?BOY/,'jb'],[/JUNIOR ?GIRL/,'jg'],[/SENIOR ?BOY/,'sb'],[/SENIOR ?GIRL/,'sg'],[/VETERAN/,'ve'],[/LADIES/,'la'],[/GENTS/,'ge']];
function toISO(v){
  if(v instanceof Date && !isNaN(v)){ const t=new Date(v.getTime()+12*36e5); return t.toISOString().slice(0,10) }
  if(typeof v==='number' && v>1000){ return new Date(Math.round((v-25569)*864e5)+12*36e5).toISOString().slice(0,10) }
  const s=String(v||'').trim(); let m;
  if(m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if(m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/)){ let y=+m[3]; if(y<100) y+= y>40?1900:2000; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}` }
  if(m=s.match(/^(19|20)\d{2}$/)) return `${s}-01-01`;
  return '';
}
function matchUnit(v){ const s=String(v||'').trim(); if(!s) return ''; if(UNITS.includes(s)) return s;
  const up=s.toUpperCase().replace(/[^A-Z ]/g,' ').replace(/\s+/g,' ').trim(); for(const k in UNIT_EN) if(up.includes(k)) return UNITS[UNIT_EN[k]];
  return UNITS.find(u=>s.includes(u))||'' }
function parseWorkbook(wb,file){
  const rows=[], food=[]; let unit='';
  if(wb.Sheets.START){ const c=wb.Sheets.START['C5']; if(c) unit=matchUnit(c.v) }
  wb.SheetNames.forEach(sn=>{
    const key=(SHEETMAP.find(([re])=>re.test(sn.toUpperCase().replace(/[^A-Z]+/g,' ').replace(/\s+/g,' ').trim()))||[])[1]; if(!key) return;
    const A=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
    if(!unit) for(const r of A.slice(0,6)) for(const c of r){ const m=String(c).match(/(?:UNIT|TEAM)\s*:\s*(.+)/i); if(m&&matchUnit(m[1])){ unit=matchUnit(m[1]) } }
    const h=A.findIndex(r=>r.some(c=>/PARTICIPANT|^NAME/i.test(String(c).trim()))); if(h<0) return;
    const H=A[h].map(x=>String(x).toUpperCase().replace(/\s+/g,' ').trim());
    const f=re=>H.findIndex(x=>re.test(x));
    const iN=f(/PARTICIPANT|^NAME/), iD=f(/DATE OF BIRTH|DOB/), iM=f(/MEMBERSHIP/), iR=f(/ROLE/), iP=f(/PHONE/), iX=f(/REMARK/), iT=f(/^TYPE/), iA=f(/ADULT/), iC=f(/CHILD/);
    const start=Math.max(iN,iD,iM)+1, end=iX>=0?iX:H.length;
    const evCols=[]; for(let j=start;j<end;j++) if(H[j] && ![iR,iP].includes(j)) evCols.push(j);
    for(const r of A.slice(h+1)){
      const sl=String(r[0]).trim(), nm=String(r[iN]||'').trim();
      if(!/^\d+(\.0+)?$/.test(sl) || !nm || /SIGNATURE|TOTAL/i.test(nm)) continue;
      if(key==='food'){ const a=parseInt(r[iA])||0, k=parseInt(r[iC])||0; food.push({n:nm,t:String(r[iT]||'').trim()||'Spectator',a,k,m:Math.max(1,a+k)}); continue }
      const rec={n:nm,c:key,dob:iD>=0?toISO(r[iD]):'',m:iM>=0?String(r[iM]).trim():''};
      if(isTeam(key)){ rec.role=iR>=0?String(r[iR]).trim():''; rec.e=[] }
      else { const c=cat(key); rec.e=evCols.map((j,i)=>String(r[j]).trim()?c.e[i]:null).filter(Boolean) }
      rows.push(rec);
    }
  });
  return {file,unit,rows,food};
}

/* ================= CHEST NUMBERS ================= */
const pkey = x => x.u+'|'+norm(x.n);
// Chest numbers run by age group, youngest first; teams are mixed inside each series so a number never reveals the team.
const CN_SERIES={sjb:1,sjg:1,jb:2,jg:2,sb:3,sg:3,ssb:4,ssg:4,ge:5,la:6,ve:7,k:8};
const CN_LABEL=[[1,'Sub Junior'],[2,'Junior'],[3,'Senior'],[4,'Super Senior'],[5,'Gents'],[6,'Ladies'],[7,'Veterans'],[8,'Kids']];
function seriesOf(rows){
  const ind=rows.find(x=>CN_SERIES[x.c]); if(ind) return CN_SERIES[ind.c];
  const t=rows[0]||{}, y=t.dob?+t.dob.slice(0,4):0;
  const g=t.c==='twl'?['F']:(['fg','fb','vb','tw'].includes(t.c)?['M']:['M','F']);
  for(const gg of g){ const c=y&&findCat(y,gg); if(c) return CN_SERIES[c.id] }
  return t.c==='twl'?6:t.c==='fb'?4:5;
}
const hashStr = s => { let h=2166136261; for(const ch of s){ h^=ch.codePointAt(0); h=Math.imul(h,16777619) } return h>>>0 };
async function assignChest(renumber){
  const groups=new Map(); shared.entries.forEach(x=>{ const k=pkey(x); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(x) });
  const have={}, used=new Set();
  if(!renumber) groups.forEach((rows,k)=>{ const c=(rows.find(x=>x.cn)||{}).cn; if(c){ have[k]=c; used.add(c) } });
  const todo=[...groups.keys()].filter(k=>!have[k]).sort((a,b)=>hashStr(a)-hashStr(b)||a.localeCompare(b));
  todo.forEach(k=>{ const base=seriesOf(groups.get(k))*1000; let n=base+1; while(used.has(n)) n++; have[k]=n; used.add(n) });
  let n=0; for(const x of shared.entries.slice()){ const c=have[pkey(x)]; if(c && x.cn!==c){ await Data.update('entries',x.id,{cn:c}); n++ } }
  return n;
}
const missingChest = () => new Set(shared.entries.filter(x=>!x.cn).map(pkey)).size;

function people(unit,q){
  const m=new Map();
  shared.entries.filter(x=>x.u===unit).forEach(x=>{ const k=norm(x.n); if(!m.has(k)) m.set(k,{n:x.n,u:x.u,items:[]}); m.get(k).items.push(x) });
  return [...m.values()].filter(p=>!q||norm(p.n).includes(q));
}
function personEvents(p){
  const out=[];
  p.items.forEach(x=>{ if(isTeam(x.c)) out.push({t:cat(x.c).n,k:cat(x.c).ic}); else (x.e||[]).forEach(ev=>out.push({t:ev,k:evKey(ev)})) });
  return out;
}
const personCn = p => (p.items.find(x=>x.cn)||{}).cn || '';
function personCat(p){ const ind=p.items.find(x=>!isTeam(x.c)); return ind?cat(ind.c).n:(cat(p.items[0].c)?.n||'') }

/* ================= REGISTRATION DESK (volunteers) ================= */
const deskKey=(u,n)=>u+'|'+norm(n);
const deskDocs=()=>shared.desk||[];
function deskMap(){ const m=new Map(); deskDocs().forEach(d=>m.set(d.k,d)); return m }
function usedChest(skipK){ const s=new Set(); shared.entries.forEach(x=>{ if(x.cn && pkey(x)!==skipK) s.add(+x.cn) }); deskDocs().forEach(d=>{ if(d.cn && d.k!==skipK) s.add(+d.cn) }); return s }
function nextChest(series){ const u=usedChest(); let n=series*1000+1; while(u.has(n)) n++; return n }
function seriesFor(y,g){ const c=y&&g?findCat(+y,g):null; return c?(CN_SERIES[c.id]||5):(g==='F'?6:5) }
function deskPeople(){ const out=[], seen=new Set();
  allPeople().forEach(p=>{ const k=deskKey(p.u,p.n); seen.add(k); const cn=(p.items.find(x=>x.cn)||{}).cn||''; const dob=(p.items.find(x=>x.dob)||{}).dob||'';
    out.push({k,n:p.n,u:p.u,src:'entry',cn,cat:personCat(p),y:dob.slice(0,4),g:'',ser:seriesOf(p.items)}) });
  regList().forEach(r=>{ const k=deskKey(r.u,r.n); if(seen.has(k)) return; seen.add(k); const c=r.y&&r.g?findCat(+r.y,r.g):null;
    out.push({k,n:r.n,u:r.u,src:'reg',cn:'',cat:c?c.n:'',y:r.y||'',g:r.g||'',a:r.a||0,kd:r.k||0}) });
  return out }

function parseRegs(wb,file){
  const ws=wb.Sheets[wb.SheetNames[0]], A=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
  const H=(A[0]||[]).map(x=>String(x).toLowerCase()), f=re=>H.findIndex(x=>re.test(x));
  const iN=f(/name|പേര്/), iU=f(/team|ടീം|unit|യൂണിറ്റ്/), iY=f(/birth|ജനന/), iG=f(/gender|ലിംഗ/), iM=f(/member|അംഗത്വ/), iA=f(/adult|മുതിർന്ന/), iK=f(/child|കുട്ടി/);
  if(iN<0) return null;
  const m=new Map(); let bad=0;
  A.slice(1).forEach(r=>{ const n=String(r[iN]||'').trim().replace(/\s+/g,' '); if(!n) return;
    const u=iU>=0?matchUnit(r[iU]):''; if(!u) bad++;
    const ym=String(iY>=0?r[iY]:'').match(/(19|20)\d{2}/), y=ym?+ym[0]:0;
    const gs=String(iG>=0?r[iG]:''), g=/female|പെൺ|^\s*f/i.test(gs)?'F':/male|ആൺ|^\s*m/i.test(gs)?'M':'';
    const ms=String(iM>=0?r[iM]:'').split('/')[0].trim();
    const a=Math.max(0,parseInt(iA>=0?r[iA]:0)||0), k=Math.max(0,parseInt(iK>=0?r[iK]:0)||0);
    m.set((u||'?')+'|'+norm(n)+'|'+y,{n,u,y,g,m:ms,a,k}) });
  return {file,list:[...m.values()],bad,rows:A.length-1};
}

const MEDAL=['#C9A227','#9AA3AB','#B0703C'];

function standings(){
  const t={}; UNITS.forEach(u=>t[u]={u,pts:0,m:[0,0,0]});
  shared.results.forEach(r=>(r.p||[]).forEach((p,i)=>{ const x=t[p[1]]; if(!x) return; x.pts+=(PTS[r.ty]||PTS.ind)[i]||0; x.m[i]++ }));

}

/* ================= MY PAGE ================= */
const VENUE={field:'Field',track:'Track',ladies:'Ladies Field (inside the building)',sp:'Throws & Jumps area'};
const STOP=new Set(['race','the','with','by','min','minute','count','holding','hand','heats','final','finals','mtrs','and','kg']);
const toks = e => new Set(String(e).toLowerCase().replace(/×/g,' ').replace(/(\d)m\b/g,'$1').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w)));
const grp = c => c.n.replace(/ (Boys|Girls)$/,'').replace(/ \(.*\)$/,'');
function catMatch(label,c){ if(!label) return false; if(label===c.n) return true; if(c.id==='k'&&/^Kids/.test(label)) return true;
  return /[,&]/.test(label) && label.split(/,|&/).map(x=>x.trim()).includes(grp(c)) }
const TEAM_SCH={fg:['Football Tournament','Gents'],fb:['Football Tournament','Boys'],vb:['Volleyball','Gents'],tw:['Tug of War','Gents'],twl:['Tug of War','Ladies'],bd:['Badminton','General']};
function schFor(c,ev){
  const out=[];
  if(c==='mp') return [{t:'8:45 AM',v:'Main ground',e:'March Past & Flag Hoisting'}];
  ['field','track','ladies','sp'].forEach(k=>SCH[k].forEach(r=>{ if(r[0]==='BREAK') return;
    if(isTeam(c)){ const [w,l]=TEAM_SCH[c]||[]; if(w&&r[1].includes(w)&&r[3]===l) out.push({t:r[0],v:VENUE[k],e:r[1]}) ; return }
    const C=cat(c); if(!catMatch(r[3],C)) return;
    if(/relay/i.test(ev)!==/relay/i.test(r[1])) return;
    const a=toks(ev), b=toks(r[1]); let hit=0; a.forEach(w=>{ if(b.has(w)) hit++ });
    if(a.size && hit>=(a.size<=2?a.size:Math.ceil(a.size/2))) out.push({t:r[0],v:VENUE[k]+(r[2]?' · '+r[2]:''),e:r[1]}) }));
  return out;
}
function allPeople(){ const m=new Map(); shared.entries.forEach(x=>{ const k=pkey(x); if(!m.has(k)) m.set(k,{n:x.n,u:x.u,items:[]}); m.get(k).items.push(x) }); return [...m.values()] }
function myResults(p){
  const out=[];
  shared.results.forEach(r=>(r.p||[]).forEach((w,i)=>{
    const mine = r.ty==='ind' ? (norm(w[0])===norm(p.n)&&w[1]===p.u) : (w[1]===p.u && p.items.some(x=>x.c===r.c&&(isTeam(r.c)||(x.e||[]).includes(r.e))));
    if(mine) out.push({r,i});
  }));
  return out;
}

     <div style="background:#fff;color:#111;border-radius:14px;border:4px solid ${col&&col!=='#FFFFFF'?col:'#E8112D'};font:800 30px/1 var(--f-disp);padding:10px 12px;min-width:92px">${cn||'—'}</div></div></div>
     ${cn?'':`<p style="font-size:12px;opacity:.8;margin:8px 0 0">${T('ചെസ്റ്റ് നമ്പർ ഉടൻ നൽകും · Chest number coming soon','Chest number coming soon')}</p>`}</div>
   <h2 class="sec">${T('എന്റെ ഇനങ്ങളും സമയവും','My events & times')}</h2>
   <div class="stack">${items.map(it=>{ const S=schFor(it.c,it.e); const res=R.find(x=>x.r.c===it.c&&x.r.e===it.e);

function tvSlides(){
  const R=shared.results.slice().sort((a,b)=>(b.at||0)-(a.at||0));

function tvNow(){ const d=new Date(Date.now()+ (new Date().getTimezoneOffset()+240)*6e4); return d }

  if(sl.k==='news') return `<h2 class="tvh">${T('അറിയിപ്പുകൾ <small>News</small>','News')}</h2><div class="tvnews">${[0,1,2].map(notice).map(n=>`<div class="tvcard"><span class="tvtag" style="background:${n[0]==='Important'?'#C91235':n[0]==='New'?'#019087':'#316880'}">${n[0]}</span><b>${n[1]}</b><p>${n[2]}</p></div>`).join('')}</div>`;
  const now=tvNow(), day=now.toISOString().slice(0,10)==='2026-12-02', mins=day?now.getUTCHours()*60+now.getUTCMinutes():0;

function tvTick(){
  const el=$('#tvslide'); if(!el){ stopTV(); return }

function tvStatic(){
  const pod=$('#tvpod'); if(!pod) return;

  const t=$('#tvtick'); if(t && t.dataset.txt!==txt){ t.dataset.txt=txt; t.innerHTML=`<span>${esc(txt)}   •   ${esc(txt)}</span>` }
  const c=$('#tvclock'); if(c){ const d=tvNow(); c.textContent=String(d.getUTCHours()%12||12)+':'+String(d.getUTCMinutes()).padStart(2,'0')+(d.getUTCHours()<12?' AM':' PM') }

function startTV(){ stopTV(); tvIdx=0; tvTick(); tvStatic(); tvTimer=setInterval(()=>{ tvTick(); tvStatic() },5000);

function winOK(p){ if(!p||!p.rid) return false; const r=shared.results.find(x=>x.id===p.rid), i=+p.p;
  return !!(r && r.p && r.p[i] && r.p[i][0]===p.n && r.p[i][1]===p.u && r.e===p.e && r.c===p.c) }
function winCands(){ const q=norm((state.win||{}).q); if(q.length<2) return [];
  const out=[]; shared.results.slice().sort((a,b)=>(b.at||0)-(a.at||0)).forEach(r=>(r.p||[]).forEach((x,i)=>{ if(!x) return;
    if(norm(x[0]).includes(q)||norm(x[1]).includes(q)||norm(un(x[1])).includes(q)) out.push({rid:r.id,i,r,x}) })); return out.slice(0,30) }

function poly(x,pts){ x.beginPath(); pts.forEach(([a,b],i)=>i?x.lineTo(a,b):x.moveTo(a,b)); x.closePath() }
function containerShape(x,pts,fill,sh=12){ x.save(); x.translate(sh,sh); poly(x,pts); x.fillStyle='rgba(16,25,33,.3)'; x.fill(); x.restore(); poly(x,pts); x.fillStyle=fill; x.fill() }
function grain(x,W,H,a=.14){ if(!grainPat){ const g=document.createElement('canvas'); g.width=g.height=220; const gx=g.getContext('2d'), d=gx.createImageData(220,220);
    let sd=5; for(let i=0;i<d.data.length;i+=4){ sd=(sd*16807)%2147483647; const v=sd%255; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255 } gx.putImageData(d,0,0); grainPat=g }
  x.save(); x.globalAlpha=a; x.globalCompositeOperation='multiply'; x.fillStyle=x.createPattern(grainPat,'repeat'); x.fillRect(0,0,W,H); x.restore() }
function canvasConfetti(x,n,X,Y,W,H,seed,sz=1){ let sd=seed; const r=()=>(sd=(sd*16807)%2147483647)/2147483647; const C=['#C91235','#008540','#101921','#ffffff'];
  for(let i=0;i<n;i++){ x.save(); x.translate(X+r()*W,Y+r()*H); x.rotate(r()*Math.PI); x.fillStyle=C[i%4]; x.fillRect(-4*sz,-9*sz,8*sz,18*sz); x.restore() } }
// Official framed logo (horizontal or vertical) with a one-sided extension holding the year number.
async function drawLockup(x,X,Y,lh,dir='h',ext='#316880'){
  const k=dir==='h'?'L_h':'L_v', [w0,h0]=brDim(k), lw=lh*w0/h0, padX=lh*(dir==='h'?.376:.23), padY=lh*(dir==='h'?.30:.24);
  const cw=lw+2*padX, H=lh+2*padY, [yw0,yh0]=brDim('Y_p3b'), yh=H*.72, yw=yh*yw0/yh0, ew=yw+H*.3, st=Math.max(2,H*.022);
  const lg=await brI(k,'#101921'), yr=await brI('Y_p3b','#F4EED7');
  x.fillStyle='#F4EED7'; x.fillRect(X,Y,cw,H); x.fillStyle=ext; x.fillRect(X+cw,Y,ew,H);
  if(lg) x.drawImage(lg,X+padX,Y+padY,lw,lh); if(yr) x.drawImage(yr,X+cw+(ew-yw)/2,Y+(H-yh)/2,yw,yh);
  x.strokeStyle='#101921'; x.lineWidth=st; x.strokeRect(X+st/2,Y+st/2,cw+ew-st,H-st); x.beginPath(); x.moveTo(X+cw,Y); x.lineTo(X+cw,Y+H); x.stroke();
  return [cw+ew,H];
}
const lockupW=(lh,dir='h')=>{ const k=dir==='h'?'L_h':'L_v', [w0,h0]=brDim(k), padX=lh*(dir==='h'?.376:.23), padY=lh*(dir==='h'?.30:.24), H=lh+2*padY, [yw0,yh0]=brDim('Y_p3b'); return lh*w0/h0+2*padX + H*.72*yw0/yh0 + H*.3 };

async function saveCanvas(cv,name){

  try{
    const blob=await new Promise(ok=>cv.toBlob(ok,'image/png'));
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:'UIC Family Sports Meet 2026'}); return }catch(e){ if(e&&e.name==='AbortError') return } }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast(T('സേവ് ചെയ്തു · Saved','Saved'));
  }catch(err){ if(err&&err.code==='declined') return; toast(T('ലോങ് പ്രസ് ചെയ്ത് സേവ് ചെയ്യുക · Long-press the image to save','Long-press the image to save it')) }
}

/* ================= ROUTING & EVENTS ================= */
function route(){
  const h=(location.hash||'').slice(1);
  if(h==='public'){ PUB=true; try{ localStorage.removeItem('uic_org') }catch(e){} return '' }
  if(h==='join'){ PUB=true; state.posterMode='join'; return 'poster' }
  if(h==='tv') return '';
  if(h==='desk') return '';
  if(PUB && h==='regs') return '';
  if(h==='organiser') return '';
  return (PUB && h==='reg') ? 'me' : h;
}
function render(){
  const r=route();
  if(r==='tv'){ $('#root').innerHTML=tvShell(); startTV(); return }
  stopTV();
  $('#root').innerHTML = PAGES[r] ? shell(r,pages[r]()) : home();
  if(!PAGES[r]) tickCountdown();
  if(r==='poster') drawPoster();
}
function go(k){ if(location.hash.slice(1)===k){render()} else location.hash=k; scrollTo(0,0) }
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
setInterval(tickCountdown,30000);

      try{ const ref=DB.doc('lost/'+uid), s=await ref.get(), reports=s.exists?[...(s.data().reports||[])]:[]; reports.push(rep); await ref.set({reports}) }
      catch(err){ t.disabled=false; toast('Could not send. Tell the help desk directly.'); return } }
    else if(DB || !PREVIEW){ t.disabled=false; toast(T('ഹെൽപ്പ് ഡെസ്കിൽ നേരിട്ട് അറിയിക്കുക','Please tell the help desk directly.')); return }
    else { shared.lost.unshift(rep); persist('lost') }
    render(); toast(T('Report sent · വിവരം നൽകി','Report sent')) }
});
document.addEventListener('change',async e=>{
  const id=e.target.id;
  if(['ru','rd','rg','rm'].includes(id)){ grabDraft(); render(); const dt=document.querySelector('details.card'); if(dt) dt.open=true }
  else if(id==='fg'){ state.findG=e.target.value; render() }
  else if(id==='uf'){ state.unitF=e.target.value; refreshShared() }
  else if(id==='meu'){ state.me={...(state.me||{}),u:e.target.value,pick:null}; $('#meBox').innerHTML=meHTML() }
  else if(id==='resf'){ state.resF=e.target.value; refreshShared() }
  else if(id==='rc'){ state.rd={c:e.target.value}; state.rdOpen=true; render() }
  else if(id==='re'){ state.rd={...(state.rd||{c:'jb'}),e:e.target.value}; state.rdOpen=true; render() }
  else if(id==='fuq'){ state.foodU=e.target.value; refreshShared() }
  else if(id==='impunit'){ if(state.imp) state.imp.unit=e.target.value }
  else if(id==='regfile' && e.target.files[0]){ const file=e.target.files[0];
    $('#regImpBox').insertAdjacentHTML('beforeend','<p class="mu">Reading…</p>');
    try{ await loadXLSX(); const wb=/\.csv$/i.test(file.name)?XLSX.read(await file.text(),{type:'string'}):XLSX.read(await file.arrayBuffer(),{type:'array'});
      state.regImp=parseRegs(wb,file.name); if(!state.regImp||!state.regImp.list.length){ state.regImp=null; toast(T('ഈ ഫയലിൽ പേരുകൾ കണ്ടില്ല','No names found in this file')) } }
    catch(err){ state.regImp=null; toast(T('ഫയൽ വായിക്കാനായില്ല','Could not read this file')) }
    $('#regImpBox').innerHTML=regImpHTML() }
  else if(id==='impfile' && e.target.files[0]){ const file=e.target.files[0];
    $('#impBox').insertAdjacentHTML('beforeend','<p class="mu" id="implo">Reading…</p>');
    try{ await loadXLSX(); const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});
      state.imp=parseWorkbook(wb,file.name);
      if(!state.imp.rows.length && !state.imp.food.length){ state.imp=null; toast('No names found in this file. Is it the entry form?') }
    }catch(err){ state.imp=null; toast('Could not read this file. Save it as .xlsx and try again.') }
    $('#impBox').innerHTML=importHTML() }
  else if(id==='ju'){ state.join.u=e.target.value; state.join.conf=null; state.join.reg=null; state.join.general=false; $('#joinBox').innerHTML=joinMatchHTML(); drawPoster() }
  else if(id==='jphoto' && e.target.files[0]){ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{joinPhoto=im; drawPoster()}; im.src=fr.result }; fr.readAsDataURL(e.target.files[0]) }
  else if(id==='pphoto' && e.target.files[0]){ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{posterPhoto=im; drawPoster()}; im.src=fr.result }; fr.readAsDataURL(e.target.files[0]) }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='fy'){ state.findYear=e.target.value.replace(/\D/g,''); if(state.findYear.length===4||!state.findYear){ const pos=e.target.selectionStart; render(); const f=$('#fy'); f.focus(); f.setSelectionRange(pos,pos) } }
  else if(id==='faqq'){ state.faqQ=e.target.value; render(); const f=$('#faqq'); f.focus(); f.setSelectionRange(f.value.length,f.value.length) }
  else if(id==='fq'){ state.foodQ=e.target.value; $('#foodBox').innerHTML=foodFindHTML() }
  else if(id==='cq'){ state.counterQ=e.target.value; $('#counterBox').innerHTML=counterHTML() }
  else if(id==='meq'){ state.me={...(state.me||{}),q:e.target.value,pick:null}; $('#meBox').innerHTML=meHTML() }
  else if(id==='entq'){ state.entQ=e.target.value; $('#entriesBox').innerHTML=entriesHTML() }
  else if(id==='jq'){ state.join.q=e.target.value; $('#joinBox').innerHTML=joinMatchHTML() }
  else if(id==='wq'){ state.win={q:e.target.value}; $('#winBox').innerHTML=winMatchHTML() }
  else if(id==='dq'){ state.deskQ=e.target.value; state.deskSel=null; $('#deskList').innerHTML=deskListHTML() }
  else if(id==='du'){ state.deskU=e.target.value; state.deskSel=null; $('#deskList').innerHTML=deskListHTML() }
  else if(id==='dr'){ if(state.deskSel){ state.deskSel.role=e.target.value; state.deskSel.cnPick=null; $('#deskList').innerHTML=deskListHTML() } }
  else if(id==='dcn'){ if(state.deskSel) state.deskSel.cnPick=e.target.value }
  else if(['sy','sr','sg'].includes(id)){ const r=$('#sr').value, f=$('#scn'); f.disabled=r!=='comp'; if(r==='comp'){ const y=$('#sy').value.trim(); if(/^\d{4}$/.test(y)) f.value=nextChest(seriesFor(+y,$('#sg').value)) } else f.value='' }
  else if(id==='regq'){ state.regQ=e.target.value; const b=$('#regsBox'); b.innerHTML=regsHTML(); const f=$('#regq'); f.focus(); f.setSelectionRange(f.value.length,f.value.length) }
  else if(id==='jn'){ state.join.n=e.target.value; clearTimeout(drawPoster.h); drawPoster.h=setTimeout(drawPoster,250) }
});
document.documentElement.lang=LANG;
render();
initShared();
</script>
